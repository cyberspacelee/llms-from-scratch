[project]
name = "llms-from-scratch"
version = "0.1.0"
description = "Runnable primitives and experiments for the Chinese LLM curriculum"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "torch>=2.6,<3"]

[project.scripts]
llms-from-scratch = "llms_from_scratch.experiments:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]
gpu = ["triton>=3; platform_system == 'Linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llms_from_scratch", "examples"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["ruff>=0.16.10"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["B007", "B905"]
