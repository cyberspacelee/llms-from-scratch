<script type="text/plain" id="lesson-source">本篇把理解位置编码需要的数学工具单独展开。每章先用 SVG 图解建立直觉，再逐步推导公式，最后说明它在注意力或 RoPE 中解决什么问题。无需先熟悉复数或矩阵指数；从二维箭头开始即可。

> 阅读路线：向量与坐标 → 范数与归一化 → 点积与投影 → 矩阵与正交性 → 极坐标 → 欧拉公式 → 矩阵指数 → 高维分块 → RoPE。

前六章是核心基础，第七章是进阶推导，第八、九章把平面几何接到实际注意力头。读完后继续 [01 位置编码](../training/position-encoding.html)。

## 01 · 向量与坐标：用一组数描述方向

<figure class="math-figure">
<div class="math-figure-scroll" tabindex="0" role="region" aria-label="坐标是沿基方向的步数，可横向滚动"><img src="../assets/math/01-vectors.svg" alt="坐标是沿基方向的步数" width="640" height="440"></div>
<figcaption>从原点沿横轴走 3 个单位、纵轴走 4 个单位，就得到向量 (3, 4)。图中绿色箭头是合成结果，红、蓝箭头是两个标准基。</figcaption>
</figure>

向量可以看成一组有序实数；选定坐标基后，二维列向量写为 $a=(a_1,a_2)^\top$，高维向量写为 $a\in\mathbb R^d$。上标 $\top$ 表示转置，把行变成列或把列变成行。token 的表示是学习到的高维向量，单个坐标不必对应可直接命名的语义属性。

### 从两个基向量理解坐标

在平面上选定 $e_1=(1,0)^\top$ 与 $e_2=(0,1)^\top$ 后，$a=(3,4)^\top$ 就意味着 $a=3e_1+4e_2$：沿第一条坐标轴走 3，沿第二条走 4。坐标是向量在这组基下的描述；RoPE 实际操作的是模型选定坐标系中的数值。

向量加法逐坐标进行，数乘则把每个坐标乘同一个数：

$$
\begin{bmatrix}3\\4\end{bmatrix}+\begin{bmatrix}1\\-2\end{bmatrix}
=\begin{bmatrix}4\\2\end{bmatrix},\qquad
2\begin{bmatrix}3\\4\end{bmatrix}=\begin{bmatrix}6\\8\end{bmatrix}.
$$

正数倍缩放保持方向，负数倍缩放还会反向。三维以上不必强行想象箭头；坐标运算、点积和范数的定义仍然成立。把一个 128 维注意力头按相邻维度配对，就得到 64 个二维子空间，每对都可以使用同一套平面几何。

### 向量与坐标系不是一回事

图中的两个基向量只是我们选定的描述方式。同一支几何箭头，在不同坐标基下可以有不同坐标。例如把原来的两条坐标轴都逆时针转 $90^\circ$，新基是 $f_1=(0,1)^\top,f_2=(-1,0)^\top$。原来的箭头 $a=(3,4)^\top$ 就可以写成 $a=4f_1-3f_2$，在新基下坐标是 $(4,-3)^\top$。

这个例子只改变描述箭头的坐标系，箭头本身没有移动。后面 RoPE 使用的是另一种操作：**保持坐标系固定，实际旋转向量**。区分这两种视角，可以避免把旋转方向的正负号弄反。

### 从二维箭头到 token 表示

模型先通过词嵌入把 token ID 映射为一组数，后续层再更新这些数。向量的维度是特征坐标的数量，不是 token 在句子中的位置。例如一个 token 的表示可以是 $x_i\in\mathbb R^{128}$，其中下标 $i$ 表示它在序列中的位置，128 表示这个向量包含多少个坐标。位置索引与特征维度承担不同职责。

我们无法像平面箭头那样直接画出 128 维向量，但可以对它逐坐标运算，也可以取出两个坐标观察。二维图在这里解释运算规则，并不意味着每两个坐标都具有可以人工命名的语义。

本篇统一把单个向量写成列。$a=(3,4)^\top$ 是 $2\times1$，而 $a^\top=(3,4)$ 是 $1\times2$。它们存放相同的两个数，但参与矩阵乘法时形状不同：$a^\top b$ 产生一个标量，$ab^\top$ 则产生一个矩阵。第 03、04 章会分别展开这两种计算中需要的规则。

## 02 · 范数与归一化：分清长度、距离和方向

<figure class="math-figure">
<div class="math-figure-scroll" tabindex="0" role="region" aria-label="范数、距离与归一化，可横向滚动"><img src="../assets/math/02-norm.svg" alt="范数、距离与归一化" width="640" height="440"></div>
<figcaption>左图两支箭头长度均为 5，但终点相距 6；右图将 (3, 4) 缩短到原来的五分之一，得到同方向的单位向量。</figcaption>
</figure>

本文的“范数”专指欧氏范数，也叫 $L_2$ 范数：

$$
\|a\|_2=\sqrt{a^\top a}=\sqrt{\sum_{r=1}^{d}a_r^2}.
$$

例如 $a=(3,4)^\top$ 的范数是 $5$。非零向量可写成 $a=\|a\|_2\widehat a$，其中 $\widehat a=a/\|a\|_2$ 是单位向量：范数描述长度，单位向量描述方向。后文省略下标 2。

### 向量有多长，与两个向量相距多远

先把向量画成从原点出发的箭头。$a=(3,4)^\top$ 的终点位于横坐标 3、纵坐标 4 的位置。根据勾股定理，这支箭头的长度是 $\sqrt{3^2+4^2}=5$，也就是它的欧氏范数 $\|a\|$。

现在再画一支箭头 $b=(-3,4)^\top$。它的长度也是 5，但两支箭头指向不同的位置。如果要问它们的**终点相距多远**，就需要计算从一个终点到另一个终点的位移。这个位移由坐标相减得到：

$$
a-b=\begin{bmatrix}3-(-3)\\4-4\end{bmatrix}
=\begin{bmatrix}6\\0\end{bmatrix},\qquad
\|a-b\|=\sqrt{6^2+0^2}=6.
$$

所以，$\|a\|$ 测量的是一支箭头自身的长度，$\|a-b\|$ 测量的是两支箭头终点之间的距离。它们使用同一个求长度的方法，只是测量的对象不同：前者是 $a$，后者是位移向量 $a-b$。

### 归一化：沿原方向，把长度变成 1

知道向量的长度后，我们就可以把长度和方向分开考虑。假如只想比较两支箭头朝向哪里，而不希望长短影响比较，可以先沿各自的方向把它们缩放到单位长度。这个操作叫作 **$L_2$ 归一化**。

仍以 $a=(3,4)^\top$ 为例。它的长度是 5，因此将两个坐标都除以 5：

$$
\widehat a=\frac{a}{\|a\|}
=\begin{bmatrix}3/5\\4/5\end{bmatrix},\qquad
\|\widehat a\|=\sqrt{\left(\frac35\right)^2+\left(\frac45\right)^2}=1.
$$

这里 $\widehat a$ 读作“a 帽”，用来表示 $a$ 对应的单位向量。两个坐标都乘以同一个正数 $1/5$，所以箭头的方向没有改变，只是长度从 5 缩短到了 1。

再看 $c=(6,8)^\top$。它与 $a$ 同向，长度是 10。将它除以自己的长度，同样得到 $(3/5,4/5)^\top$。也就是说，原来长度不同的两个向量，归一化后可能完全相同。**如果只保留归一化结果，就无法知道原向量有多长**；要恢复原向量，还需要另外保留它的范数，再用 $a=\|a\|\widehat a$ 乘回去。

这也帮助我们区分归一化与后面要讲的旋转：归一化保持方向，把长度统一为 1；旋转保持长度，改变方向。RoPE 使用旋转，正是要在保留 Q/K 长度的同时，通过位置改变它们的相对方向。

上述归一化只适用于非零向量。零向量的长度为 0，也没有确定的方向，因此不能用“除以自身长度”的方式得到单位向量。程序中可以给分母加一个很小的正数来避免除零，但对零向量而言，结果仍是零向量，并不会因此产生一个方向。

### 补充：范数的三条性质如何对应长度直觉？

前面的计算都符合我们对长度的直觉。这些直觉可以写成三条数学性质，后面推导时会用到：

- **长度不会是负数。** $\|a\|\ge0$，并且只有 $a=0$ 时长度才为零。
- **整体缩放，长度按比例变化。** $\|ca\|=|c|\|a\|$。例如将 $(3,4)^\top$ 乘以 2，长度从 5 变成 10；乘以 -2，箭头还会反向，但长度仍是 10。这就是公式中使用绝对值 $|c|$ 的原因。
- **直接到达终点，不会比绕路更长。** $\|a+b\|\le\|a\|+\|b\|$。先沿 $a$ 走，再从那里沿 $b$ 走，两段路的总长是 $\|a\|+\|b\|$；从原点直接走到最终位置，对应向量 $a+b$，长度是 $\|a+b\|$。这条关系叫作三角不等式。

本讲义后面说“旋转保持范数”，指的就是保持这里用勾股定理计算的欧氏长度。

## 03 · 点积与投影：长度和夹角如何决定分数

<figure class="math-figure">
<div class="math-figure-scroll" tabindex="0" role="region" aria-label="向量点积与有符号投影，可横向滚动"><img src="../assets/math/03-dot-product.svg" alt="向量点积与有符号投影" width="640" height="440"></div>
<figcaption>先把 b 投影到 a 的方向，得到有符号长度，再乘 a 的长度。图中的蓝色虚线表示投影过程；本章下方还有可调长度与角度的交互 SVG。</figcaption>
</figure>

对两个非零实向量，点积的代数表示与几何表示是同一个量：

$$
\vec a\cdot\vec b=a^\top b
=\sum_{r=1}^{d}a_rb_r
=\|a\|\,\|b\|\cos\theta,
\qquad 0\le\theta\le\pi.
$$

这里 $\theta$ 是两向量的夹角。由余弦定理，$\|a-b\|^2=\|a\|^2+\|b\|^2-2\|a\|\|b\|\cos\theta$；另一方面，展开平方得到 $\|a-b\|^2=\|a\|^2+\|b\|^2-2a^\top b$，比较即得点积公式。若有一个向量为零，点积为零，但夹角未定义。

固定长度时，夹角从 $0$ 增至 $\pi$，点积从 $\|a\|\|b\|$ 减至 $-\|a\|\|b\|$。例如长度分别为 2 和 3 时：

| 夹角 $\theta$ | $0$ | $\pi/3$ | $\pi/2$ | $\pi$ |
|---|---|---|---|---|
| 点积 $6\cos\theta$ | 6 | 3 | 0 | -6 |

因此可以通过改变夹角调节点积，而不必改变长度。把两个非零向量都归一化后，它们的点积就等于余弦相似度。注意力使用的通常是未归一化 Q/K 的缩放点积，所以长度也参与决定分数。

### 另一条推导路线：点积是在测量投影

先把 $a$ 归一化成方向 $\widehat a$。向量 $b$ 沿这个方向的**有符号投影长度**是 $\widehat a^\top b=\|b\|\cos\theta$。再乘回 $\|a\|$，就得到 $a^\top b=\|a\|\|b\|\cos\theta$。

“有符号”意味着投影可以为负。锐角时 $b$ 在 $a$ 的正方向上有分量；直角时没有这个分量；钝角时分量朝反方向。投影向量本身则是：

$$
\operatorname{proj}_a b
=\frac{a^\top b}{a^\top a}a
=(\widehat a^\top b)\widehat a.
$$

用 $a=(3,4)^\top,b=(4,0)^\top$ 检查三种算法：坐标点积为 $3\times4+4\times0=12$；范数分别为 5 和 4，因此 $\cos\theta=12/20=0.6$；$b$ 在 $a$ 方向上的投影长度为 $4\times0.6=2.4$，再乘 $a$ 的长度 5，仍得到 12。

### 点积的范围，以及范数对注意力的影响

由于 $|\cos\theta|\le1$，有柯西–施瓦茨不等式 $|a^\top b|\le\|a\|\|b\|$。同向或反向时达到边界。它给出固定范数下分数的最大变化范围，并不表示所有位置都一定能达到边界。

固定夹角时，增大范数会放大点积的绝对值：正点积变得更正，负点积变得更负，零点积仍为零。因此“范数越大就越受关注”不是普遍结论。例如 $q=(1,0)^\top$，$k_1=(1,0)^\top$ 与 $k_2=(2,0)^\top$ 方向相同，点积为 1 和 2；但若 $k_2=(-2,0)^\top$，较大的范数对应的点积反而是 -2。

进一步固定同一个查询面对的所有键。将 $q$ 乘以正数 $c$，会把整行 logits 都乘以 $c$。若原 logits 是 $(1,0)$，softmax 约为 $(0.731,0.269)$；放大两倍后为 $(2,0)$，权重约为 $(0.881,0.119)$。查询范数在这个受控例子中影响分布的尖锐程度；改变单个键的范数则只改变该候选的 logit。这里的数值直接从 logits 开始，注意力的固定缩放因子已包含在内。

<div class="lab" id="dot-product-lab"></div>

实验中的绿色实线是 $a$，红色虚线是 $b$，蓝色虚线表示 $b$ 在 $a$ 方向上的投影。建议依次尝试：固定长度改变内容相位差；固定角度改变长度；只改变共同旋转；最后改变额外相对旋转。四次操作分别对应“方向影响分数”“长度影响尺度”“共同旋转保持点积”“不同旋转引入位置关系”。

## 04 · 矩阵与正交变换：旋转为什么保长

<figure class="math-figure">
<div class="math-figure-scroll" tabindex="0" role="region" aria-label="正交旋转保持基向量的长度和夹角，可横向滚动"><img src="../assets/math/04-matrix.svg" alt="正交旋转保持基向量的长度和夹角" width="640" height="440"></div>
<figcaption>两支单位基向量一起转过 90°，长度仍为 1，彼此仍然垂直。矩阵的列记录它们的新坐标，正交性把这个几何事实写成 RᵀR = I。</figcaption>
</figure>

矩阵 $M\in\mathbb R^{m\times d}$ 将 $d$ 维列向量映射为 $m$ 维列向量：$(Ma)_r=\sum_s M_{rs}a_s$。其第 $s$ 列是第 $s$ 个标准基向量变换后的结果；$ABa$ 表示先应用 $B$，再应用 $A$。单位矩阵 $I$ 不改变向量，逆矩阵则撤销变换。

普通矩阵可以拉伸、压缩或剪切向量。若方阵满足 $R^\top R=I$，则称为正交矩阵，并有 $R^{-1}=R^\top$。二维逆时针旋转是其中一种：

$$
R(\phi)=\begin{bmatrix}\cos\phi&-\sin\phi\\\sin\phi&\cos\phi\end{bmatrix},
\qquad
\|Ra\|^2=a^\top R^\top Ra=a^\top a=\|a\|^2.
$$

这就证明旋转保持范数。正交矩阵也包括反射，不能把所有正交变换都叫旋转。两个向量施加**同一个**正交变换时，$(Ra)^\top(Rb)=a^\top b$，夹角也保持；RoPE 能改变分数，是因为不同位置通常使用不同旋转。本章继续展开矩阵计算；第 07 章再从矩阵指数解释旋转的来源。

### 把矩阵乘法逐项算一次

取 $M=\begin{bmatrix}2&1\\0&1\end{bmatrix}$，则：

$$
M\begin{bmatrix}3\\4\end{bmatrix}
=\begin{bmatrix}2\times3+1\times4\\0\times3+1\times4\end{bmatrix}
=\begin{bmatrix}10\\4\end{bmatrix}
=3\begin{bmatrix}2\\0\end{bmatrix}+4\begin{bmatrix}1\\1\end{bmatrix}.
$$

最后一种写法说明“矩阵的列就是基向量的去向”。它也解释了线性：$M(ua+vb)=uMa+vMb$。原向量范数为 5，变换后为 $\sqrt{116}$，可见线性变换并不自动保长。

转置把矩阵的行列互换：$M^\top=\begin{bmatrix}2&0\\1&1\end{bmatrix}$。它一般不是逆矩阵；本例 $M^{-1}=\begin{bmatrix}1/2&-1/2\\0&1\end{bmatrix}$。只有在正交条件下，转置才恰好撤销原变换。

### 为什么转置乘积能判断保长？

若矩阵的两列记作 $u,v$，那么：

$$
R^\top R=
\begin{bmatrix}u^\top u&u^\top v\\v^\top u&v^\top v\end{bmatrix}.
$$

等于单位矩阵意味着两列长度都是 1，且彼此垂直。对旋转矩阵，令 $c=\cos\phi,s=\sin\phi$，实际相乘得到：

$$
\begin{bmatrix}c&s\\-s&c\end{bmatrix}
\begin{bmatrix}c&-s\\s&c\end{bmatrix}
=\begin{bmatrix}c^2+s^2&-cs+sc\\-sc+cs&s^2+c^2\end{bmatrix}=I.
$$

所以前面的 $\|Ra\|^2=a^\top R^\top Ra$ 证明没有跳过任何额外假设。也可以直接把旋转后坐标平方相加，交叉项抵消，剩下 $(x^2+y^2)(c^2+s^2)=x^2+y^2$。

### 为什么相对旋转里出现减号？

旋转有三条后面反复使用的规则：$R(0)=I$，$R(\phi)^{-1}=R(-\phi)=R(\phi)^\top$，$R(\phi)R(\psi)=R(\phi+\psi)$。最后一条可以用三角加法公式逐项验证，也可以理解为先转 $\psi$ 再转 $\phi$。

注意转置乘积会倒序：$(AB)^\top=B^\top A^\top$。于是两个分别旋转的向量做点积时：

$$
\begin{aligned}
(R(\phi)a)^\top(R(\psi)b)
&=a^\top R(\phi)^\top R(\psi)b\\
&=a^\top R(-\phi)R(\psi)b\\
&=a^\top R(\psi-\phi)b.
\end{aligned}
$$

可以把这个过程想象为把观察坐标系反转 $\phi$，先让 $a$ 回到原方向，$b$ 就只剩相对于它的额外转角。取 $\phi=\psi$，额外转角为零，点积不变；取 $\phi=i\omega,\psi=j\omega$，便留下 $(j-i)\omega$。

二维旋转彼此可交换，但普通矩阵乘法不可随意交换。尤其学习到的 Q/K 投影矩阵一般不与旋转矩阵交换，所以“先投影再旋转”不能任意改为“先旋转再投影”。

## 05 · 极坐标与三角函数：把旋转变成相位相加

<figure class="math-figure">
<div class="math-figure-scroll" tabindex="0" role="region" aria-label="从直角坐标转换到极坐标，可横向滚动"><img src="../assets/math/05-polar.svg" alt="从直角坐标转换到极坐标" width="640" height="440"></div>
<figcaption>横纵坐标由半径 r 和相位 α 决定。旋转时半径不变，只把相位从 α 改成 α + φ；展开三角加法公式即可得到旋转后的两个坐标。</figcaption>
</figure>

对非零二维向量 $(x,y)^\top$，令 $r=\sqrt{x^2+y^2}$，用 $\alpha=\operatorname{atan2}(y,x)$ 确定所在象限，就有：

$$
x=r\cos\alpha,\qquad y=r\sin\alpha.
$$

$r$ 是半径，也就是向量范数；$\alpha$ 是相对横轴的有向角，也叫相位，允许相差整数个 $2\pi$。相位与两个向量间取值为 $[0,\pi]$ 的夹角不是同一个概念。本文角度均用弧度：一周是 $2\pi$。

旋转 $\phi$ 只需把 $(r,\alpha)$ 改为 $(r,\alpha+\phi)$。转回直角坐标并展开三角加法公式，即得到 $R(\phi)(x,y)^\top$。这解释了为什么旋转改变方向却不改变长度。

### 用极坐标把旋转矩阵推出来

从 $x=r\cos\alpha,y=r\sin\alpha$ 开始，旋转后的坐标是：

$$
\begin{aligned}
x'&=r\cos(\alpha+\phi)
=r\cos\alpha\cos\phi-r\sin\alpha\sin\phi
=x\cos\phi-y\sin\phi,\\
y'&=r\sin(\alpha+\phi)
=r\sin\alpha\cos\phi+r\cos\alpha\sin\phi
=x\sin\phi+y\cos\phi.
\end{aligned}
$$

按 $x,y$ 的系数排列，就是前面的旋转矩阵。例如 $(3,4)^\top$ 旋转 $\pi/2$ 后得到 $(-4,3)^\top$；原相位约为 $53.13^\circ$，新相位约为 $143.13^\circ$，范数仍然为 5。角度制只用来帮助读图，公式和程序中的三角函数使用弧度。

为什么使用 `atan2(y,x)`？仅看 $\arctan(y/x)$，$(1,1)$ 和 $(-1,-1)$ 的比值同为 1，无法区分象限；还会遇到 $x=0$ 的除零问题。`atan2` 结合两个坐标的符号确定相位。RoPE 实现不需要真的计算 `atan2`，这里只用它解释内容向量原本的方向。

### 相位、夹角、频率与周期不要混在一起

两个非零二维向量相位为 $\alpha,\beta$ 时，有向相位差是 $\delta=\beta-\alpha$；几何夹角是 $\theta=\arccos(\cos\delta)\in[0,\pi]$。比如 $\delta=3\pi/2$ 与 $\delta=-\pi/2$ 指向同一个方向，相应夹角都是 $\pi/2$。这就是“不断增加旋转角”不等于“不断增大夹角”的原因。

位置 $p$ 是 token 索引，角频率 $\omega$ 表示每移动一个 token 转多少弧度，二者相乘得到无量纲相位 $p\omega$。例如 $\omega=\pi/4$ 时，位置 0、1、2 对应转角 0、$\pi/4$、$\pi/2$，每走 8 个 token 转完一周。一般连续位置下的周期为 $2\pi/\omega$；整数位置要精确重复，还要求存在非零整数 $N$ 满足 $N\omega=2\pi k$。不能把任意实数周期直接当成整数序列的重复步数。

## 06 · 复数与欧拉公式：用乘法完成旋转

<figure class="math-figure">
<div class="math-figure-scroll" tabindex="0" role="region" aria-label="复数乘虚数单位对应四分之一圈旋转，可横向滚动"><img src="../assets/math/06-complex.svg" alt="复数乘虚数单位对应四分之一圈旋转" width="640" height="440"></div>
<figcaption>从 z = 1 + i 出发，反复乘 i，每次逆时针转 90°，四次后回到原来的向量。一般角度用单位复数 e^(iφ) 表示。</figcaption>
</figure>

将 $(x,y)^\top$ 对应到复数 $z=x+\mathrm{i}y$，其中 $\mathrm{i}^2=-1$，不要将虚数单位 $\mathrm{i}$ 与 token 下标 $i$ 混淆。复数的模 $|z|=\sqrt{x^2+y^2}$ 对应向量范数。欧拉公式把极坐标和指数连接起来：

$$
e^{\mathrm{i}\alpha}=\cos\alpha+\mathrm{i}\sin\alpha,
\qquad z=r e^{\mathrm{i}\alpha}.
$$

可从指数的幂级数验证：利用 $\mathrm{i}^2=-1$，把偶次项与奇次项分别收集，得到

$$
e^{\mathrm{i}\alpha}
=\left(1-\frac{\alpha^2}{2!}+\frac{\alpha^4}{4!}-\cdots\right)
+\mathrm{i}\left(\alpha-\frac{\alpha^3}{3!}+\frac{\alpha^5}{5!}-\cdots\right)
=\cos\alpha+\mathrm{i}\sin\alpha.
$$

于是 $ze^{\mathrm{i}\phi}=r e^{\mathrm{i}(\alpha+\phi)}$：乘单位复数就是旋转，模仍为 $r$。这与旋转矩阵是同一运算的两种表示，不要求模型学习复数参数。

共轭 $\bar z=x-\mathrm{i}y=r e^{-\mathrm{i}\alpha}$ 让相位变号。若 $w=u+\mathrm{i}v$，则 $\operatorname{Re}(\bar z w)=xu+yv$ 正好是实向量点积；结合极坐标，又得到 $\operatorname{Re}(\bar z w)=|z||w|\cos(\beta-\alpha)$。后面 RoPE 的“相对位置差”，就来自共轭变号与相位相加。

### 为什么乘虚数单位就转了 90 度？

直接计算 $\mathrm{i}(x+\mathrm{i}y)=-y+\mathrm{i}x$，坐标从 $(x,y)$ 变成 $(-y,x)$，正好是逆时针四分之一圈。连续乘两次得到 $-z$，四次得到 $z$，与 $\mathrm{i}^2=-1,\mathrm{i}^4=1$ 完全一致。

一般复数乘法则为：

$$
(x+\mathrm{i}y)(u+\mathrm{i}v)
=(xu-yv)+\mathrm{i}(xv+yu).
$$

因此“把实向量写成复数”本身没有改变数据；特殊之处在于复数乘法刚好同时完成了两个坐标的交叉组合。取 $u=\cos\phi,v=\sin\phi$，上式立即变成旋转坐标公式。

在极坐标下，$(r e^{\mathrm{i}\alpha})(s e^{\mathrm{i}\beta})=rs e^{\mathrm{i}(\alpha+\beta)}$，所以一般复数乘法既缩放又旋转。RoPE 乘的是模为 1 的 $e^{\mathrm{i}p\omega}$，才只旋转、不缩放。若额外乘幅度因子，保范数结论就需要重新检查。

### 共轭为何必不可少？逐项展开一次

$$
\begin{aligned}
\bar z w&=(x-\mathrm{i}y)(u+\mathrm{i}v)
=(xu+yv)+\mathrm{i}(xv-yu),\\
\operatorname{Re}(\bar z w)&=xu+yv.
\end{aligned}
$$

若漏掉共轭，$\operatorname{Re}(zw)=xu-yv$，就不是原来的实点积。取 $z=3+4\mathrm{i},w=4$，$\bar z w=12-16\mathrm{i}$，实部 12 与前面的向量算例相同。复数内积整体可能是复数；这里用于注意力的，是它对应的**实部**。

给两个向量分别乘位置相位后：

$$
\begin{aligned}
\overline{z e^{\mathrm{i}i\omega}}\,w e^{\mathrm{i}j\omega}
&=\bar z e^{-\mathrm{i}i\omega}\,w e^{\mathrm{i}j\omega}\\
&=\bar z w e^{\mathrm{i}(j-i)\omega}.
\end{aligned}
$$

矩阵表示中，转置把查询旋转变为逆旋转；复数表示中，共轭把查询相位变为负相位。两种推导的减号来自同一件事。

## 07 · 矩阵指数：连续旋转从哪里来？

<figure class="math-figure">
<div class="math-figure-scroll" tabindex="0" role="region" aria-label="用生成元和矩阵指数描述连续旋转，可横向滚动"><img src="../assets/math/07-exponential.svg" alt="用生成元和矩阵指数描述连续旋转" width="640" height="440"></div>
<figcaption>绿色 v 从原点指向圆周，红色 Jv 从终点沿切线指向瞬时运动方向。把这样的无穷小变化连续合成，得到保持长度的有限旋转。</figcaption>
</figure>

前面已经从几何和复数理解了旋转。这一章进一步回答：如果希望一个变换连续变化、可以组合，并且始终保长，为什么二维旋转会自然出现？这部分使用导数与幂级数；可以先读图和结论，掌握前六章后再回来看推导。

一维正交变换只有 $+1$ 和 $-1$，没有丰富的连续变化。二维中，考虑与单位矩阵连续相连、可微的一族正交变换 $R(t)$。记 $G=R'(0)$。对 $R(t)^\top R(t)=I$ 在零点求导：

$$
G^\top+G=0.
$$

这里还要求 $R(0)=I$，并且 $R(t+s)=R(t)R(s)$：先走一段参数，再走另一段，应与一次走完等效。参数 $t$ 可以理解为连续的位置变量；这里只是为推导暂时将整数 token 位置推广到实数。

$G$ 叫作生成元，描述刚开始时向量朝哪个方向变化。上面的求导使用乘积法则：$R'(0)^\top R(0)+R(0)^\top R'(0)=0$。代入 $R(0)=I$ 后，就得到 $G^\top=-G$，即反对称条件。对任意 $v$，它意味着 $v^\top Gv=0$，所以瞬时变化 $Gv$ 与当前位置 $v$ 垂直；图中的切线方向正是在表示这一点。

二维反对称矩阵只能形如 $G=\omega J$，其中：

$$
J=\begin{bmatrix}0&-1\\1&0\end{bmatrix},\qquad J^2=-I.
$$

由合成律求导得 $R'(t)=R(t)G$，且 $R(0)=I$，因此 $R(t)=\exp(tG)$。现在展开矩阵指数，将偶次幂与奇次幂分别收集：

$$
\begin{aligned}
e^{t\omega J}
&=\left(1-\frac{(t\omega)^2}{2!}+\frac{(t\omega)^4}{4!}-\cdots\right)I\\
&\quad+\left(t\omega-\frac{(t\omega)^3}{3!}+\frac{(t\omega)^5}{5!}-\cdots\right)J\\
&=\cos(t\omega)I+\sin(t\omega)J\\
&=\begin{bmatrix}\cos(t\omega)&-\sin(t\omega)\\\sin(t\omega)&\cos(t\omega)\end{bmatrix}.
\end{aligned}
$$

这里的矩阵指数由幂级数定义：$e^A=I+A+A^2/2!+\cdots$，每个幂都表示矩阵乘法，不能理解为把矩阵中每个元素分别取指数。因为 $J^2=-I$，高次幂只在 $I,J,-I,-J$ 之间循环，所以整个级数能收集为两个标量函数乘矩阵。

例如取 $\omega=1,t=\pi/2$，得到 $e^{(\pi/2)J}=J$，它将 $(3,4)^\top$ 变成 $(-4,3)^\top$，与前面的几何旋转一致。只保留线性近似 $I+\varepsilon J$ 则不是精确旋转：$(I+\varepsilon J)^\top(I+\varepsilon J)=(1+\varepsilon^2)I$。这说明“小步沿切线移动”只是瞬时直觉，有限角度的精确保长需要完整的旋转算子。

sin/cos 在这里不是被随意塞进公式的：**连续、可组合、保长度的二维平移表示，可以通过旋转实现，而旋转矩阵指数自然包含 sin/cos。** 这是一条帮助理解的数学构造路线，不应当冒充原论文完整的历史推导，也不是证明所有位置编码只能这样设计。

## 08 · 分块矩阵与多频率：从二维走到高维

<figure class="math-figure">
<div class="math-figure-scroll" tabindex="0" role="region" aria-label="四维向量分成两个独立旋转平面，可横向滚动"><img src="../assets/math/08-blocks.svg" alt="四维向量分成两个独立旋转平面" width="640" height="440"></div>
<figcaption>第一对旋转 π/2，第二对旋转 π。每对的平方范数分别保持为 5 和 25，总平方范数因此保持为 30；多频率 RoPE 为各对分配不同旋转速度。</figcaption>
</figure>

二维图方便理解，但实际注意力头通常不止两个坐标。高维 RoPE 的做法是把坐标分成若干对，让每一对在自己的平面内旋转，然后把结果拼回去。

### 四维算例：两个平面，各转各的

设 $q=(1,2,3,4)^\top$。第一对 $(1,2)^\top$ 旋转 $\phi_0$，第二对 $(3,4)^\top$ 旋转 $\phi_1$。用一个矩阵同时表达这两件事，就是分块对角矩阵：

$$
T=\begin{bmatrix}
\cos\phi_0&-\sin\phi_0&0&0\\
\sin\phi_0&\cos\phi_0&0&0\\
0&0&\cos\phi_1&-\sin\phi_1\\
0&0&\sin\phi_1&\cos\phi_1
\end{bmatrix}
=\operatorname{diag}(R(\phi_0),R(\phi_1)).
$$

“分块”指把小矩阵当作大矩阵的组成单位；“对角”指两个旋转块之外的系数都为零。因此第一对不会混入第二对的坐标。取 $\phi_0=\pi/2,\phi_1=\pi$，便有：

$$
Tq=(-2,1,-3,-4)^\top,\qquad
\|Tq\|^2=4+1+9+16=30=\|q\|^2.
$$

第一对的平方范数始终为 5，第二对始终为 25，总平方范数就是两者之和。更一般地，每个块都满足 $R_m^\top R_m=I_2$，所以整个矩阵满足 $T^\top T=I$。高维保范数由各二维分块的保范数直接得到。

### 为什么每对使用不同频率？

令第 $m$ 对在位置 $p$ 旋转 $p\omega_m$。如果所有频率都相同，所有分块会按同一种速度绕圈；使用不同频率，则让某些分块对短位移敏感，另一些随位置缓慢变化。多个尺度的响应共同参与最终点积。

标准 RoPE 常用几何频率 $\omega_m=B^{-2m/d_h}$，其中 $d_h$ 为偶数头维度，$m=0,\ldots,d_h/2-1$。其含义是让 $\log\omega_m$ 等间隔；底数 $B$ 是设计选择，并不是保范数或相对位置性质要求的唯一常数。

当 $d_h=4,B=10000$ 时，两对的频率是 1 和 0.01 弧度/token。相同位移 10，在两个平面内分别累积 10 和 0.1 弧度。两者都保长，但改变方向的速度不同。

### 总点积为什么是各平面贡献之和？

将向量按坐标对写成 $q=(q^{(0)},\ldots,q^{(M-1)})$，其中 $M=d_h/2$。这里的括号表示拼接，$q^{(m)}$ 是一个二维列向量。由于点积按坐标相乘再求和：

$$
(T_iq)^\top(T_jk)
=\sum_{m=0}^{M-1}(q^{(m)})^\top R((j-i)\omega_m)k^{(m)}.
$$

若第 $m$ 对的长度为 $r_{q,m},r_{k,m}$，相位为 $\alpha_m,\beta_m$，每一项又可以写成：

$$
r_{q,m}r_{k,m}\cos\big(\beta_m-\alpha_m+(j-i)\omega_m\big).
$$

所以高维 RoPE 分数是多个“长度乘积 × 相位差余弦”的和。不同分块可以相互加强，也可以相互抵消。不能把这个和一般化为某个统一频率下的单一二维转角，也不能仅凭距离变大就断言它单调下降。零向量分块的贡献为零，不需要给它定义相位。

### 为什么代码不用真的构造大矩阵？

大矩阵中绝大部分元素都是零。直接对每对坐标计算 $x'=x\cos\phi-y\sin\phi$、$y'=x\sin\phi+y\cos\phi$，就能得到相同结果，运算量随头维度线性增长。分块矩阵适合证明，逐对计算适合实现。

具体模型可能采用相邻维度配对，也可能把前后两半维度配对。只要排列与模型权重及实现约定一致，几何原理相同；随意改变配对方式则会改变实际计算。

## 09 · 从数学回到 RoPE：对照、串联与自检

<figure class="math-figure">
<div class="math-figure-scroll" tabindex="0" role="region" aria-label="共同旋转和相对旋转对点积的不同影响，可横向滚动"><img src="../assets/math/09-rope.svg" alt="共同旋转和相对旋转对点积的不同影响" width="640" height="440"></div>
<figcaption>三组向量的长度都为 1。共同旋转后夹角仍为 30°，点积不变；只让 k 额外转 60°，夹角变为 90°，点积变为零。</figcaption>
</figure>

| 操作 | 实向量／矩阵 | 极坐标 | 复数 |
|---|---|---|---|
| 表示一个二维内容向量 | $(x,y)^\top$ | $(r,\alpha)$ | $x+\mathrm{i}y=r e^{\mathrm{i}\alpha}$ |
| 长度 | $\sqrt{x^2+y^2}$ | $r$ | $|z|$ |
| 旋转 $\phi$ | $R(\phi)a$ | $(r,\alpha+\phi)$ | $ze^{\mathrm{i}\phi}$ |
| 撤销旋转 | $R(\phi)^\top$ | 相位减去 $\phi$ | 乘 $e^{-\mathrm{i}\phi}$ |
| 两向量点积 | $a^\top b$ | $rs\cos(\beta-\alpha)$ | $\operatorname{Re}(\bar z w)$ |

实际阅读论文时，先确认向量排列方式、旋转正方向，以及共轭落在哪一侧，再比较正负号。本讲义统一使用列向量、$(x,y)$ 对应 $x+\mathrm{i}y$、逆时针正旋转，因此相对旋转写作 $j-i$。

### 沿一条计算链把这些工具接起来

给定二维内容 $q=(1,0)^\top,k=(\sqrt3/2,1/2)^\top$，先使用第 02 章的范数公式，知道两者长度都为 1；再使用第 05 章的极坐标表示，知道它们的内容相位分别为 0 与 $\pi/6$。第 03 章的点积公式于是给出原分数 $\cos(\pi/6)$。

接着给两个向量分别添加位置转角 $i\omega,j\omega$。第 04 章的正交性质保证两个长度仍为 1，第 06 章的复数乘法说明相位分别增加这些角度。新的分数因此为：

$$
\cos\left(\frac\pi6+j\omega-i\omega\right)
=\cos\left(\frac\pi6+(j-i)\omega\right).
$$

取 $\omega=\pi/6,i=0,j=2$，新相位差是 $\pi/2$，点积降为零。若同时把两个位置加 10，新增的共同角度抵消，结果仍为零。图中展示的就是这个区别：共同转角不改变相对方向，只给一个向量额外旋转才会调节点积。

第 07 章解释了为什么旋转可以用可组合、保长的连续变换构造；第 08 章则把上述二维分数扩展成多个频率分块的贡献之和。到这里，RoPE 所需的数学工具已经齐备。至于为什么把这种结构放在 Q/K 上、它与其他位置编码有何差别，继续由位置编码篇讨论。

### 自检：是否真正理解“旋转改变了什么”？

先独立回答，再展开核对。这里都只讨论旋转这一步，保持输入内容不变。

<details>
<summary>1. 将 a = (3, 4) 旋转 90°，结果与范数是什么？</summary>

结果是 $(-4,3)^\top$，范数仍为 $\sqrt{16+9}=5$。坐标变了、方向变了、长度没变。归一化则会把长度改为 1，因此不能用归一化解释旋转。

</details>

<details>
<summary>2. 两个向量都旋转 90°，点积会改变吗？只旋转其中一个呢？</summary>

同转不变。取 $a=(1,0)^\top,b=(1,1)^\top$，原点积为 1；同转后分别为 $(0,1)^\top,(-1,1)^\top$，点积仍为 1。只旋转 $b$ 后，点积变为 -1。后一种情况中两个范数依旧不变，但相对方向改变了。

</details>

<details>
<summary>3. 为什么不能说“范数相同，所以语义相同”？</summary>

同一个圆上的向量范数全部相同，方向却不同，面对同一查询的点积可以完全不同。范数是表示的一个标量属性；它是否与某种语义特征相关，需要在具体模型中通过测量或干预验证。

</details>

<details>
<summary>4. 为什么不能说“位置越远，夹角越大”？</summary>

位置差改变有向相位，而几何夹角会随相位绕圈反复增减。取相同单位内容向量、$\omega=\pi/2$，位移 0、1、2、3、4 的点积依次为 1、0、-1、0、1，显然不是单调下降。

</details>
