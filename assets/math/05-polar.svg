<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">


  <title id="title">05 / 直角坐标与极坐标描述同一个点</title>
  <desc id="desc">一支箭头的长度r和相位alpha决定终点，横坐标r乘cos alpha，纵坐标r乘sin alpha；旋转只增加相位。</desc>


  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#087c70"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c54834"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#245fb0"/>
    </marker>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#172521"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#ffffff"/>


  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="28" y="36" font-size="22" fill="#172521" text-anchor="start">05 / 直角坐标与极坐标描述同一个点</text>
    <line x1="115" y1="296" x2="483" y2="296" stroke="#d5ddd7" stroke-width="1"/>
    <line x1="115" y1="330" x2="115" y2="84" stroke="#d5ddd7" stroke-width="1"/>
    <line x1="115" y1="296" x2="360" y2="126" stroke="#087c70" stroke-width="4" marker-end="url(#green)"/>
    <line x1="360" y1="126" x2="360" y2="296" stroke="#245fb0" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="360" cy="126" r="4" fill="#087c70" stroke="#087c70"/>
    <path d="M177 296 A62 62 0 0 0 166 261" fill="none" stroke="#c54834" stroke-width="2"/>
    <text x="181" y="279" font-size="23" fill="#c54834" text-anchor="start">α</text>
    <text x="215" y="196" font-size="23" fill="#087c70" text-anchor="start">r</text>
    <text x="219" y="325" font-size="21" fill="#245fb0" text-anchor="start">x = r cos α</text>
    <text x="378" y="224" font-size="21" fill="#245fb0" text-anchor="start">y = r sin α</text>
    <text x="372" y="113" font-size="22" fill="#172521" text-anchor="start">(x, y) ↔ (r, α)</text>
    <text x="91" y="318" font-size="16" fill="#58635e" text-anchor="start">0</text>
    <text x="481" y="321" font-size="17" fill="#58635e" text-anchor="start">x</text>
    <text x="93" y="91" font-size="17" fill="#58635e" text-anchor="start">y</text>
    <rect x="28" y="357" width="584" height="61" rx="4" fill="#f0f3f1" stroke="none"/>
    <text x="320" y="394" font-size="21" fill="#172521" text-anchor="middle">旋转 φ：(r, α) → (r, α + φ)，半径 r 不变</text>
  </g>
</svg>
