<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" fill="none">
  <g fill="#263a34" font-size="18"><text x="20" y="28">截断 SVD：保留多少平方能量，还剩多少矩阵误差？</text></g>
  <g fill="#68726d" font-size="15"><text x="20" y="72">奇异值</text><text x="266" y="72">保留秩 r</text><text x="420" y="72">保留能量</text><text x="555" y="72">残差范数</text></g>
  <g fill="#263a34" font-size="16"><text x="22" y="112">s₁ = 5</text><text x="22" y="161">s₂ = 2</text><text x="22" y="210">s₃ = 1</text></g>
  <g fill="#087f70"><rect x="97" y="89" width="125" height="25" rx="2"/><rect x="97" y="138" width="50" height="25" rx="2"/><rect x="97" y="187" width="25" height="25" rx="2"/></g>
  <path d="M246 56V254" stroke="#d5ddd7"/>
  <g fill="#263a34" font-size="16"><text x="270" y="101">0</text><text x="270" y="147">1</text><text x="270" y="193">2</text><text x="270" y="239">3</text><text x="422" y="101">0%</text><text x="422" y="147">83.3%</text><text x="422" y="193">96.7%</text><text x="422" y="239">100%</text><text x="563" y="101">√30</text><text x="563" y="147">√5</text><text x="563" y="193">1</text><text x="563" y="239">0</text></g>
  <g fill="#e1eee9"><rect x="318" y="90" width="86" height="12" rx="2"/><rect x="318" y="136" width="86" height="12" rx="2"/><rect x="318" y="182" width="86" height="12" rx="2"/><rect x="318" y="228" width="86" height="12" rx="2"/></g>
  <g fill="#087f70"><rect x="318" y="136" width="71.7" height="12" rx="2"/><rect x="318" y="182" width="83.2" height="12" rx="2"/><rect x="318" y="228" width="86" height="12" rx="2"/></g>
  <path d="M20 264H640" stroke="#d5ddd7"/>
  <text x="20" y="286" font-size="15" fill="#68726d">总平方能量 = 5² + 2² + 1² = 30；剩余误差 = √(被删除奇异值的平方和)</text>
</svg>
