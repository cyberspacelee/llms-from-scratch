<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-labelledby="title desc">
<title id="title">共享分支的前向与反向传播</title><desc id="desc">x=2 平方得到 a=4，a 一路直接进入损失，一路乘 3 得到 b=12，损失为 16。反向在 a 处累加为 4，x 的梯度为 16。</desc>
<defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#263a34"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#087f70"/></marker></defs>
<g fill="none" stroke="#263a34" stroke-width="2" marker-end="url(#f)"><path d="M150 167H265"/><path d="M390 155L493 90"/><path d="M390 185L493 240"/><path d="M620 90L714 155"/><path d="M620 240L714 185"/></g>
<g fill="#fff" stroke="#94a3b8" stroke-width="1.5"><rect x="35" y="135" width="115" height="64" rx="10"/><rect x="265" y="135" width="125" height="64" rx="10"/><rect x="493" y="58" width="127" height="64" rx="10"/><rect x="493" y="208" width="127" height="64" rx="10"/><rect x="715" y="135" width="115" height="64" rx="10"/></g>
<g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#263a34"><text x="92" y="173">x = 2</text><text x="327" y="173">a = x² = 4</text><text x="556" y="96">b = 3a = 12</text><text x="556" y="246">a = 4</text><text x="772" y="173">ℓ = 16</text></g>
<g fill="none" stroke="#087f70" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"><path d="M716 121Q660 16 619 43"/><path d="M493 43Q399 28 354 121"/><path d="M716 213Q660 306 619 291"/><path d="M493 291Q399 301 354 213"/><path d="M265 223Q201 277 135 218"/></g>
<g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#087f70"><text x="676" y="41">∂ℓ/∂b = 1</text><text x="423" y="43">1 × 3 = 3</text><text x="669" y="318">1</text><text x="423" y="319">1 × 1 = 1</text><text x="207" y="285">∂ℓ/∂x = 4 × 2x = 16</text><text x="327" y="111">∂ℓ/∂a = 3 + 1 = 4</text></g>
</svg>
