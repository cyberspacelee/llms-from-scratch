<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 59 640 381" role="img" aria-labelledby="title desc">


  <title id="title">03 / 点积把长度与相对方向连在一起</title>
  <desc id="desc">b向a方向作垂直投影，投影长度为b的范数乘夹角余弦，再乘a的范数得到点积。</desc>


  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#087f70"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c16b36"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3176b5"/>
    </marker>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#263a34"/>
    </marker>
  </defs>


  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
        <line x1="50" y1="280" x2="170" y2="280" stroke="#d5ddd7" stroke-width="1"/>
    <line x1="110" y1="220" x2="110" y2="340" stroke="#d5ddd7" stroke-width="1"/>
    <text x="162" y="303" font-size="16" fill="#68726d" text-anchor="start">x</text>
    <text x="90" y="230" font-size="16" fill="#68726d" text-anchor="start">y</text>
    <text x="91" y="302" font-size="15" fill="#68726d" text-anchor="start">0</text>
    <line x1="110" y1="280" x2="490" y2="280" stroke="#d5ddd7" stroke-width="1"/>
    <line x1="110" y1="280" x2="110" y2="90" stroke="#d5ddd7" stroke-width="1"/>
    <line x1="110" y1="280" x2="430" y2="280" stroke="#087f70" stroke-width="4" marker-end="url(#green)"/>
    <line x1="110" y1="280" x2="290" y2="100" stroke="#c16b36" stroke-width="4" marker-end="url(#red)"/>
    <line x1="290" y1="100" x2="290" y2="280" stroke="#3176b5" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="110" y1="292" x2="290" y2="292" stroke="#3176b5" stroke-width="2"/>
    <text x="430" y="265" font-size="22" fill="#087f70" text-anchor="start">a</text>
    <text x="302" y="101" font-size="22" fill="#c16b36" text-anchor="start">b</text>
    <path d="M165 280 A55 55 0 0 0 149 241" fill="none" stroke="#3176b5" stroke-width="2"/>
    <text x="173" y="258" font-size="22" fill="#3176b5" text-anchor="start">θ</text>
    <text x="135" y="326" font-size="19" fill="#3176b5" text-anchor="start">有符号投影：‖b‖ cos θ</text>
    <text x="358" y="149" font-size="18" fill="#263a34" text-anchor="start">只取 b 沿 a 方向的分量</text>
    <text x="358" y="184" font-size="18" fill="#263a34" text-anchor="start">再乘以 a 的长度</text>
    <rect x="28" y="354" width="584" height="58" rx="4" fill="#f0f3f1" stroke="none"/>
    <text x="320" y="390" font-size="21" fill="#263a34" text-anchor="middle">aᵀb = ‖a‖ × 投影长度 = ‖a‖ ‖b‖ cos θ</text>
  </g>
</svg>
