<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 55 640 385" role="img" aria-labelledby="title desc">


  <title id="title">01 / 坐标是沿基方向的步数</title>
  <desc id="desc">从原点沿横轴走3单位、纵轴走4单位，到达向量a的终点；a等于3e1加4e2。</desc>


  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#087f70"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c16b36"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3176b5"/>
    </marker>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#263a34"/>
    </marker>
  </defs>


  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
        <line x1="90" y1="310" x2="325" y2="310" stroke="#d5ddd7" stroke-width="1"/>
    <line x1="90" y1="370" x2="90" y2="80" stroke="#d5ddd7" stroke-width="1"/>
    <text x="316" y="337" font-size="16" fill="#68726d" text-anchor="start">x</text>
    <text x="70" y="91" font-size="16" fill="#68726d" text-anchor="start">y</text>
    <text x="69" y="334" font-size="15" fill="#68726d" text-anchor="start">0</text>
    <line x1="240" y1="110" x2="240" y2="310" stroke="#3176b5" stroke-width="1" stroke-dasharray="6 5"/>
    <line x1="90" y1="110" x2="240" y2="110" stroke="#3176b5" stroke-width="1" stroke-dasharray="6 5"/>
    <line x1="90" y1="310" x2="240" y2="110" stroke="#087f70" stroke-width="4" marker-end="url(#green)"/>
    <line x1="90" y1="310" x2="140" y2="310" stroke="#c16b36" stroke-width="3" marker-end="url(#red)"/>
    <line x1="90" y1="310" x2="90" y2="260" stroke="#3176b5" stroke-width="3" marker-end="url(#blue)"/>
    <text x="249" y="101" font-size="20" fill="#087f70" text-anchor="start">a = (3, 4)</text>
    <text x="155" y="344" font-size="17" fill="#263a34" text-anchor="start">横向 3</text>
    <text x="14" y="205" font-size="17" fill="#263a34" text-anchor="start">纵向 4</text>
    <text x="130" y="293" font-size="18" fill="#c16b36" text-anchor="start">e₁</text>
    <text x="59" y="257" font-size="18" fill="#3176b5" text-anchor="start">e₂</text>
    <rect x="390" y="175" width="220" height="128" rx="4" fill="#f0f3f1" stroke="none"/>
    <text x="410" y="207" font-size="22" fill="#263a34" text-anchor="start">a = 3e₁ + 4e₂</text>
    <text x="410" y="241" font-size="16" fill="#68726d" text-anchor="start">坐标：每个方向走几步</text>
    <text x="410" y="274" font-size="16" fill="#68726d" text-anchor="start">基：选定的单位方向</text>
    <text x="28" y="405" font-size="19" fill="#263a34" text-anchor="start">同一支箭头，可以写成两个基向量的线性组合。</text>
  </g>
</svg>
