<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 760 254" role="img" aria-labelledby="title desc">
<title id="title">批量线性层的三个梯度</title><desc id="desc">上游梯度 G，形状 B 乘 m，通过 G 转置乘 X 得权重梯度；沿样本轴求和得偏置梯度；乘 W 得输入梯度。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52645e"/></marker></defs>
<g font-family="Arial, PingFang SC, sans-serif" fill="#263a34">
<rect x="30" y="111" width="190" height="90" rx="10" fill="#e1eee9"/>
<text x="125" y="147" text-anchor="middle" font-size="23">G = E / B</text><text x="125" y="178" text-anchor="middle" font-size="18">上游梯度 · B × m</text>
<g fill="none" stroke="#52645e" stroke-width="2" marker-end="url(#arrow)"><path d="M220 156H270V83H317"/><path d="M220 156H317"/><path d="M220 156H270V229H317"/></g>
<rect x="325" y="56" width="405" height="55" rx="8" fill="#e2eaf7"/><text x="343" y="91" font-size="19">∇W L = Gᵀ X</text><text x="702" y="91" text-anchor="end" font-size="18">m × d</text>
<rect x="325" y="129" width="405" height="55" rx="8" fill="#f7e9da"/><text x="343" y="164" font-size="19">∇b L = G 沿样本轴求和</text><text x="702" y="164" text-anchor="end" font-size="18">m</text>
<rect x="325" y="202" width="405" height="55" rx="8" fill="#e1eee9"/><text x="343" y="237" font-size="19">∇X L = G W</text><text x="702" y="237" text-anchor="end" font-size="18">B × d</text>
</g></svg>
