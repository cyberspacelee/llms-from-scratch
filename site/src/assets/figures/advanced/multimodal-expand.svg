    <path d="M532 118V160H170V194" fill="none" stroke="#68726d" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="186" y="186" font-size="12" fill="#68726d" text-anchor="start">展开后的输入（九个位置）</text>
    <text x="20" y="282" font-size="12" fill="#68726d" text-anchor="start">模板里的一个 IMAGE 占位变成 4 个位置，文本标签要在展开后的序列上重新移位：位置 6、7 预测 ANSWER 与 EOS。</text>
