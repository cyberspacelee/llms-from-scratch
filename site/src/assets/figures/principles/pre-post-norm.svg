<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68726d"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f70"/></marker></defs>
  <g font-family="sans-serif">
    <text x="20" y="26" font-size="15" fill="#263a34" text-anchor="start" font-weight="600">Pre-Norm（本章与现代 Decoder）</text>
    <path d="M20 150H340" stroke="#087f70" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="20" y="176" font-size="14" fill="#087f70" text-anchor="start">x</text>
    <path d="M60 150V70H90" fill="none" stroke="#087f70" stroke-width="1.5" marker-end="url(#arrowA)"/>
    <rect x="92" y="54" width="80" height="32" rx="4" fill="#f0f3f1" stroke="#d5ddd7"/>
    <text x="132.0" y="74.68" font-size="13" fill="#263a34" text-anchor="middle">LN</text>
    <path d="M172 70H192" fill="none" stroke="#68726d" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="194" y="54" width="90" height="32" rx="4" fill="#e2eaf7" stroke="#3176b5"/>
    <text x="239.0" y="74.68" font-size="13" fill="#263a34" text-anchor="middle">F</text>
    <path d="M284 70H300V134" fill="none" stroke="#68726d" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="300" cy="150" r="13" fill="#fffefa" stroke="#087f70" stroke-width="1.5"/>
    <text x="300" y="155" font-size="15" fill="#087f70" text-anchor="middle">+</text>
    <text x="320" y="176" font-size="14" fill="#087f70" text-anchor="start">y</text>
    <text x="20" y="214" font-size="14" fill="#263a34" text-anchor="start">y = x + F(LN(x))</text>
    <text x="20" y="238" font-size="12" fill="#68726d" text-anchor="start">归一化只进分支；恒等路径从头贯通到尾</text>
    <text x="410" y="26" font-size="15" fill="#263a34" text-anchor="start" font-weight="600">Post-Norm（2017 年原始 Transformer）</text>
    <path d="M410 150H730" stroke="#087f70" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="410" y="176" font-size="14" fill="#087f70" text-anchor="start">x</text>
    <path d="M450 150V70H480" fill="none" stroke="#087f70" stroke-width="1.5" marker-end="url(#arrowA)"/>
    <rect x="482" y="54" width="90" height="32" rx="4" fill="#e2eaf7" stroke="#3176b5"/>
    <text x="527.0" y="74.68" font-size="13" fill="#263a34" text-anchor="middle">F</text>
    <path d="M572 70H600V134" fill="none" stroke="#68726d" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="600" cy="150" r="13" fill="#fffefa" stroke="#087f70" stroke-width="1.5"/>
    <text x="600" y="155" font-size="15" fill="#087f70" text-anchor="middle">+</text>
    <rect x="636" y="134" width="60" height="32" rx="4" fill="#f0f3f1" stroke="#d5ddd7"/>
    <text x="666.0" y="154.68" font-size="13" fill="#263a34" text-anchor="middle">LN</text>
    <text x="710" y="176" font-size="14" fill="#087f70" text-anchor="start">y</text>
    <text x="410" y="214" font-size="14" fill="#263a34" text-anchor="start">y = LN(x + F(x))</text>
    <text x="410" y="238" font-size="12" fill="#68726d" text-anchor="start">LN 包住相加结果；每层都在主路径上重新缩放</text>
  </g>
</svg>
