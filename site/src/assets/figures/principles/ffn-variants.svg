    <text x="20" y="264" font-size="12" fill="#68726d" text-anchor="start">三套矩阵，权重约 3d·d<tspan font-size="0.75em" dy="0.3em">ff</tspan><tspan dy="-0.3em">​</tspan>；同预算时把 d<tspan font-size="0.75em" dy="0.3em">ff</tspan><tspan dy="-0.3em">​</tspan> 缩到约 2/3。⊙ 是逐元素乘，门值可以为负，不是 0–1 的开关。</text>
