  <g font-size="16" fill="#263a34"><text x="24" y="28">1. 文档之间的重复关系</text><text x="324" y="28">2. 按整个连通组划分</text></g>
  <path d="M75 88H170M170 88L122 170M122 170L75 88" stroke="#087f70" stroke-width="3"/>
