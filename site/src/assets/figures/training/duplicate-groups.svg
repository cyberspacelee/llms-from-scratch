  <g fill="#e2eaf7" stroke="#3176b5" stroke-width="2"><circle cx="225" cy="170" r="24"/><circle cx="225" cy="88" r="24"/></g>
  <g fill="#263a34" font-size="16" text-anchor="middle"><text x="75" y="94">0</text><text x="170" y="94">1</text><text x="122" y="176">2</text><text x="225" y="176">4</text><text x="225" y="94">3</text></g>
  <path d="M270 125H307m-8 -6l8 6 -8 6" stroke="#68726d" stroke-width="2"/>
  <g stroke-width="2"><rect x="325" y="57" width="245" height="78" rx="4" fill="#e1eee9" stroke="#087f70"/><rect x="325" y="151" width="245" height="66" rx="4" fill="#e2eaf7" stroke="#3176b5"/></g>
  <g fill="#263a34" font-size="16"><text x="341" y="84">训练：组 {0, 1, 2} 与 {4}</text><text x="341" y="113">相似版本留在同一侧</text><text x="341" y="180">验证：组 {3}</text><text x="341" y="204" font-size="14">不参加 tokenizer 的拟合</text></g>
  <path d="M24 239H574" stroke="#d5ddd7"/>
  <g fill="#68726d" font-size="15"><text x="24" y="266">边 = 达到阈值的精确复核；0 和 2 还是完全相同的版本</text><text x="24" y="292">先分组、再划分、最后切窗口：避免同文的不同片段跨两侧</text><text x="24" y="316">图示给出一次可能的划分；具体组分配由固定 seed 决定</text></g>
