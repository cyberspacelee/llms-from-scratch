    <path d="M90 138H130V100H166" fill="none" stroke="#68726d" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M130 138V212H166" fill="none" stroke="#68726d" stroke-width="1.5" marker-end="url(#arrow)"/>
