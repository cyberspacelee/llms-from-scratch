<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 37 720 443" role="img" aria-labelledby="title desc">
  <title id="title">三种切法分别切算子、切层和复制整模</title>
  <desc id="desc">张量并行把一个矩阵乘的列切开并在卡间归约。流水并行按层分成阶段并传递激活。数据并行复制整份模型，训练时同步梯度。</desc>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    
    <text x="24" y="72" font-size="15" fill="#087f70">张量并行</text>
    <rect x="24" y="86" width="70" height="110" fill="#087f70"/>
    <rect x="98" y="86" width="70" height="110" fill="#1f8f80"/>
    <text x="36" y="146" font-size="13" fill="#fffefa">W 的</text>
    <text x="36" y="164" font-size="13" fill="#fffefa">一半列</text>
    <text x="110" y="146" font-size="13" fill="#fffefa">另一半</text>
    <text x="24" y="216" font-size="13" fill="#68726d">每步做一次 collective</text>

    <text x="250" y="72" font-size="15" fill="#245fb0">流水并行</text>
    <rect x="250" y="86" width="150" height="34" fill="#245fb0"/>
    <rect x="250" y="124" width="150" height="34" fill="#245fb0"/>
    <rect x="250" y="162" width="150" height="34" fill="#8eafd4"/>
    <rect x="250" y="200" width="150" height="34" fill="#8eafd4"/>
    <text x="262" y="108" font-size="13" fill="#fffefa">阶段 0 · 前两层</text>
    <text x="262" y="184" font-size="13" fill="#1c2926">阶段 1 · 后两层</text>
    <text x="250" y="254" font-size="13" fill="#68726d">阶段之间发送激活</text>

    <text x="470" y="72" font-size="15" fill="#b94a34">数据并行</text>
    <rect x="470" y="86" width="90" height="110" rx="4" fill="#b94a34"/>
    <rect x="576" y="86" width="90" height="110" rx="4" fill="#b94a34"/>
    <text x="490" y="146" font-size="13" fill="#fffefa">整模</text>
    <text x="596" y="146" font-size="13" fill="#fffefa">整模</text>
    <text x="470" y="216" font-size="13" fill="#68726d">训练时同步梯度</text>

    <rect x="24" y="290" width="672" height="150" rx="8" fill="#f7f8f6"/>
    <text x="44" y="322" font-size="15" fill="#1c2926">同一套 collective，走 NVLink 和走网卡不是同一个时间</text>
    <text x="44" y="354" font-size="14" fill="#68726d">H100 SXM 的 HBM 带宽是 3.35 TB/s，产品页列出的 NVLink 是 900 GB/s。</text>
    <text x="44" y="380" font-size="14" fill="#68726d">字节数由切分方式决定，秒数由这台机器的线决定。</text>
    <text x="44" y="414" font-size="14" fill="#1c2926">专家并行再加一种切法：token 只被送到它选中的专家，通信是 all-to-all。</text>
  </g>
</svg>
