<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 35 720 405" role="img" aria-labelledby="title desc">
  <title id="title">分块矩阵乘把一小块数据留在片上复用</title>
  <desc id="desc">左图每次从 HBM 读取 A 的一行和 B 的一列。右图一个 block 把 A、B 的 tile 放进 shared memory，许多乘加共用这次读取。</desc>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    
    <text x="28" y="70" font-size="15" fill="#1c2926">朴素：一个输出反复读 HBM</text>
    <rect x="28" y="88" width="120" height="150" fill="#f7f8f6" stroke="#d9e0da"/>
    <rect x="28" y="132" width="120" height="16" fill="#087f70"/>
    <text x="36" y="112" font-size="13" fill="#68726d">A</text>
    <rect x="168" y="88" width="150" height="120" fill="#f7f8f6" stroke="#d9e0da"/>
    <rect x="214" y="88" width="16" height="120" fill="#245fb0"/>
    <text x="176" y="112" font-size="13" fill="#68726d">B</text>
    <rect x="28" y="258" width="150" height="90" fill="#f7f8f6" stroke="#d9e0da"/>
    <rect x="70" y="286" width="22" height="22" fill="#b94a34"/>
    <text x="36" y="278" font-size="13" fill="#68726d">C 的一个元素</text>
    <text x="28" y="376" font-size="13" fill="#68726d">K 维每走一步都重新读绿条和蓝条</text>

    <text x="390" y="70" font-size="15" fill="#1c2926">分块：tile 留在 shared memory</text>
    <rect x="390" y="88" width="70" height="70" fill="#087f70"/>
    <rect x="478" y="88" width="70" height="70" fill="#245fb0"/>
    <text x="400" y="128" font-size="14" fill="#fffefa">A tile</text>
    <text x="488" y="128" font-size="14" fill="#fffefa">B tile</text>
    <rect x="390" y="176" width="158" height="78" rx="6" fill="none" stroke="#68726d" stroke-dasharray="5 4"/>
    <text x="400" y="198" font-size="13" fill="#68726d">shared memory</text>
    <text x="400" y="222" font-size="13" fill="#1c2926">block 内的线程一起复用</text>
    <rect x="390" y="276" width="70" height="52" fill="#b94a34"/>
    <text x="398" y="306" font-size="13" fill="#fffefa">C tile</text>
    <text x="470" y="300" font-size="13" fill="#68726d">在寄存器里累加</text>
    <text x="470" y="320" font-size="13" fill="#68726d">K 维走完再写回 HBM</text>
    <text x="390" y="376" font-size="13" fill="#68726d">一次装载服务 tile 里的全部乘加</text>
  </g>
</svg>
