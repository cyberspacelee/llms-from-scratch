<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-label="CPU与主机内存通过互连连接GPU；GPU包含多个SM、共享L2与设备内存；下方放大SM的调度、寄存器、执行和共享存储资源">
  <defs><marker id="overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3176b5"/></marker></defs>
  <g font-family="sans-serif" font-size="17" fill="#263a34">
    <text x="24" y="30" font-size="21">从主机提交，到设备执行</text>
    <rect x="24" y="48" width="260" height="72" rx="4" fill="#e1eee9" stroke="#087f70"/>
    <text x="44" y="76">CPU：运行 host 代码</text><text x="44" y="103">提交 kernel / stream / event</text>
    <rect x="436" y="48" width="260" height="72" rx="4" fill="#f0f3f1" stroke="#d5ddd7"/>
    <text x="456" y="76">主机内存</text><text x="456" y="103">输入、输出与 CPU 状态</text>
    <path d="M284 84H432 M154 120V178 M566 120V178" fill="none" stroke="#3176b5" stroke-width="2" marker-end="url(#overview-arrow)"/>
    <text x="199" y="157">互连：PCIe / NVLink 等，依平台而定</text>
    <rect x="24" y="184" width="672" height="264" rx="4" fill="none" stroke="#087f70" stroke-width="2"/>
    <text x="44" y="214" font-size="20">GPU：多个 SM 承载 block</text>
    <g fill="#e1eee9" stroke="#087f70"><rect x="44" y="230" width="194" height="70" rx="4"/><rect x="262" y="230" width="194" height="70" rx="4"/><rect x="480" y="230" width="194" height="70" rx="4"/></g>
    <text x="141" y="258" text-anchor="middle">SM 0</text><text x="359" y="258" text-anchor="middle">SM 1</text><text x="577" y="258" text-anchor="middle">其他 SM</text>
    <text x="141" y="285" text-anchor="middle">驻留 blocks / warps</text><text x="359" y="285" text-anchor="middle">驻留 blocks / warps</text><text x="577" y="285" text-anchor="middle">数量因设备而异</text>
    <path d="M141 300V325 M359 300V325 M577 300V325" fill="none" stroke="#3176b5" stroke-width="2" marker-start="url(#overview-arrow)" marker-end="url(#overview-arrow)"/>
    <rect x="44" y="329" width="630" height="40" rx="4" fill="#e2eaf7" stroke="#3176b5"/><text x="359" y="355" text-anchor="middle">L2：由多个 SM 共享的缓存</text>
    <path d="M359 369V386" stroke="#3176b5" stroke-width="2" marker-start="url(#overview-arrow)" marker-end="url(#overview-arrow)"/>
    <rect x="44" y="390" width="630" height="40" rx="4" fill="#f7e9da" stroke="#c16b36"/><text x="359" y="416" text-anchor="middle">设备内存：global 数据的常见后备存储（HBM / GDDR 等）</text>
    <path d="M141 448V478H360V491" fill="none" stroke="#68726d" stroke-dasharray="5 4"/>
    <rect x="24" y="495" width="672" height="194" rx="4" fill="none" stroke="#d5ddd7"/>
    <text x="44" y="523" font-size="20">放大一个 SM：资源属于硬件，线程编号属于程序</text>
    <rect x="44" y="542" width="194" height="54" rx="4" fill="#e2eaf7" stroke="#3176b5"/><text x="141" y="565" text-anchor="middle">warp 调度器</text><text x="141" y="586" text-anchor="middle">选取可发射的指令</text>
    <rect x="262" y="542" width="194" height="54" rx="4" fill="#e1eee9" stroke="#087f70"/><text x="359" y="565" text-anchor="middle">寄存器文件</text><text x="359" y="586" text-anchor="middle">线程状态与累加值</text>
    <rect x="480" y="542" width="194" height="54" rx="4" fill="#f7e9da" stroke="#c16b36"/><text x="577" y="565" text-anchor="middle">执行单元</text><text x="577" y="586" text-anchor="middle">算术 / 访存等指令</text>
    <rect x="44" y="616" width="630" height="52" rx="4" fill="#f0f3f1" stroke="#d5ddd7"/><text x="359" y="638" text-anchor="middle">shared memory：块内协作；L1：硬件缓存</text><text x="359" y="660" text-anchor="middle">物理资源与配置依架构而异，作用域与语义分别理解</text>
    <text x="24" y="720" fill="#68726d">图示概念关系，省略 GPC、互连细节和具体执行单元数量。</text>
    <text x="24" y="746" fill="#68726d">global 是地址空间；图中内存箭头不规定每次访问的缓存路径。</text>
  </g>
</svg>
