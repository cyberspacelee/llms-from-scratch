<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-label="软件 grid 的 block 分配到两个 SM，warp 调度与线程状态位于 SM 内">
  <g font-family="sans-serif" font-size="16" fill="#263a34">
    <text x="24" y="28">软件：一次 kernel 的 grid</text>
    <rect x="24" y="44" width="592" height="85" rx="4" fill="none" stroke="#d5ddd7"/>
    <g fill="#e1eee9" stroke="#087f70"><rect x="40" y="60" width="112" height="50" rx="4"/><rect x="176" y="60" width="112" height="50" rx="4"/><rect x="312" y="60" width="112" height="50" rx="4"/><rect x="448" y="60" width="152" height="50" rx="4"/></g>
    <text x="96" y="90" text-anchor="middle">block 0</text><text x="232" y="90" text-anchor="middle">block 1</text><text x="368" y="90" text-anchor="middle">block 2</text><text x="524" y="90" text-anchor="middle">其余 blocks</text>
    <path d="M96 129V173M368 129L230 173M232 129L448 173" fill="none" stroke="#3176b5" stroke-width="2"/>
    <text x="24" y="158">一种可能的分配</text>
    <g fill="none" stroke="#d5ddd7"><rect x="24" y="180" width="284" height="158" rx="4"/><rect x="332" y="180" width="284" height="158" rx="4"/></g>
    <text x="40" y="208">SM A：block 0、block 2</text><text x="348" y="208">SM B：block 1</text>
    <g fill="#e2eaf7" stroke="#3176b5"><rect x="40" y="223" width="252" height="40" rx="4"/><rect x="348" y="223" width="252" height="40" rx="4"/></g>
    <text x="166" y="249" text-anchor="middle">warp 调度器</text><text x="474" y="249" text-anchor="middle">warp 调度器</text>
    <text x="40" y="289">可运行 warp → 发射指令</text><text x="348" y="289">可运行 warp → 发射指令</text>
    <text x="40" y="317">线程状态 / 寄存器 / 执行单元</text><text x="348" y="317">线程状态 / 寄存器 / 执行单元</text>
    <text x="24" y="374" fill="#68726d">分配只示意关系；不表示真实 SM 数、驻留上限或启动顺序。</text>
  </g>
</svg>
