<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-label="原数组和基础切片以不同的形状与步幅指向同一数据，显式副本拥有独立数据">
<g font-family="sans-serif" font-size="16" fill="#263a34">
<rect x="16" y="14" width="232" height="75" rx="4" fill="#e1eee9" stroke="#087f70"/><text x="28" y="40">A：shape (2,3)</text><text x="28" y="66">strides (24,8) bytes</text>
<rect x="272" y="14" width="232" height="75" rx="4" fill="#e2eaf7" stroke="#3176b5"/><text x="284" y="40">v = A[:,1:]：(2,2)</text><text x="284" y="66">strides (24,8) bytes</text>
<path d="M132 89V112M388 89V112H246V133" stroke="#3176b5" fill="none" stroke-width="2"/>
<text x="16" y="121">同一块 float64 数据</text>
<g fill="#f0f3f1" stroke="#d5ddd7"><rect x="16" y="136" width="80" height="38"/><rect x="96" y="136" width="80" height="38"/><rect x="176" y="136" width="80" height="38"/><rect x="256" y="136" width="80" height="38"/><rect x="336" y="136" width="80" height="38"/><rect x="416" y="136" width="80" height="38"/></g>
<text x="56" y="161" text-anchor="middle">0</text><text x="136" y="161" text-anchor="middle">1</text><text x="216" y="161" text-anchor="middle">2</text><text x="296" y="161" text-anchor="middle">3</text><text x="376" y="161" text-anchor="middle">4</text><text x="456" y="161" text-anchor="middle">5</text>
<text x="16" y="208">v.copy()：独立数据，修改不传播到 A</text>
<g fill="#f7e9da" stroke="#c16b36"><rect x="16" y="224" width="112" height="38"/><rect x="140" y="224" width="112" height="38"/><rect x="264" y="224" width="112" height="38"/><rect x="388" y="224" width="112" height="38"/></g>
<text x="72" y="249" text-anchor="middle">1</text><text x="196" y="249" text-anchor="middle">2</text><text x="320" y="249" text-anchor="middle">4</text><text x="444" y="249" text-anchor="middle">5</text>
<text x="16" y="306" fill="#68726d">形状描述坐标，步幅描述地址移动；图不是实际指针地址。</text>
</g></svg>
