<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" role="img" aria-label="Dataset经DataLoader形成批次，训练依次清梯度、前向、反向、裁剪与更新；checkpoint包含参数优化器游标与随机状态">
  <g font-family="sans-serif" font-size="17" fill="#263a34">
    <g fill="#e1eee9" stroke="#087f70"><rect x="20" y="20" width="196" height="66" rx="4"/><rect x="242" y="20" width="196" height="66" rx="4"/><rect x="464" y="20" width="196" height="66" rx="4"/></g>
    <text x="118" y="46" text-anchor="middle">Dataset</text><text x="118" y="70" text-anchor="middle">单样本 x、y</text><text x="340" y="46" text-anchor="middle">DataLoader</text><text x="340" y="70" text-anchor="middle">顺序 / collate / 尾批</text><text x="562" y="46" text-anchor="middle">batch</text><text x="562" y="70" text-anchor="middle">实际大小可小于 B</text>
    <path d="M216 53h24m-5-5 5 5-5 5M438 53h24m-5-5 5 5-5 5M562 86v34H118v18m-5-5 5 5 5-5" fill="none" stroke="#3176b5" stroke-width="2"/>
    <g fill="#e2eaf7" stroke="#3176b5"><rect x="20" y="145" width="196" height="66" rx="4"/><rect x="242" y="145" width="196" height="66" rx="4"/><rect x="464" y="145" width="196" height="66" rx="4"/></g>
    <text x="118" y="171" text-anchor="middle">zero_grad</text><text x="118" y="195" text-anchor="middle">开始一次独立更新</text><text x="340" y="171" text-anchor="middle">forward → loss</text><text x="340" y="195" text-anchor="middle">先确定有效项分母</text><text x="562" y="171" text-anchor="middle">backward</text><text x="562" y="195" text-anchor="middle">累计到参数 .grad</text>
    <path d="M216 178h24m-5-5 5 5-5 5M438 178h24m-5-5 5 5-5 5M562 211v24H340v19m-5-5 5 5 5-5" fill="none" stroke="#3176b5" stroke-width="2"/>
    <g fill="#f7e9da" stroke="#c16b36"><rect x="242" y="260" width="196" height="66" rx="4"/><rect x="464" y="260" width="196" height="66" rx="4"/></g>
    <text x="340" y="286" text-anchor="middle">clip_grad_norm_</text><text x="340" y="310" text-anchor="middle">可选：改变已求得梯度</text><text x="562" y="286" text-anchor="middle">optimizer.step</text><text x="562" y="310" text-anchor="middle">改参数与优化器状态</text>
    <path d="M438 293h24m-5-5 5 5-5 5M562 326v31m-5-5 5 5 5-5" fill="none" stroke="#3176b5" stroke-width="2"/>
    <rect x="20" y="364" width="640" height="82" rx="4" fill="#f0f3f1" stroke="#d5ddd7"/>
    <text x="40" y="392">checkpoint：model + optimizer + step / cursor + RNG</text><text x="40" y="421">恢复时重建模型与优化器，再装载状态并恢复数据位置。</text>
    <text x="20" y="478" fill="#68726d">独立更新示意；微批累计需调整清空与 step 的边界。</text>
  </g>
</svg>
