<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">一条时间线上先看见空档，再进入单个 kernel</title>
  <desc id="desc">CPU 发射、GPU kernel、HBM 拷贝和网络各占一行。GPU 空档出现在发射间隙和网络等待期间。</desc>
  <rect width="720" height="400" fill="#fffefa"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="28" y="36" font-size="20" fill="#1c2926">Nsight Systems 先回答“时间花在哪一段”</text>
    <text x="28" y="62" font-size="14" fill="#68726d">格子是示意，不是某次采集。空的白道就是下一刀该切的地方。</text>

    <g font-size="14" fill="#1c2926">
      <text x="28" y="112">CPU</text>
      <text x="28" y="168">GPU</text>
      <text x="28" y="224">HBM</text>
      <text x="28" y="280">网络</text>
    </g>
    <g>
      <rect x="110" y="92" width="70" height="28" rx="4" fill="#245fb0"/>
      <rect x="250" y="92" width="54" height="28" rx="4" fill="#245fb0"/>
      <rect x="470" y="92" width="80" height="28" rx="4" fill="#245fb0"/>
      <text x="122" y="111" font-size="12" fill="#fffefa">launch</text>
      <text x="258" y="111" font-size="12" fill="#fffefa">launch</text>
      <text x="486" y="111" font-size="12" fill="#fffefa">launch</text>

      <rect x="190" y="148" width="150" height="28" rx="4" fill="#087f70"/>
      <rect x="560" y="148" width="120" height="28" rx="4" fill="#087f70"/>
      <text x="230" y="167" font-size="12" fill="#fffefa">GEMM</text>
      <text x="590" y="167" font-size="12" fill="#fffefa">attention</text>

      <rect x="190" y="204" width="36" height="28" rx="4" fill="#68726d"/>
      <text x="236" y="223" font-size="12" fill="#68726d">与计算重叠的拷贝</text>

      <rect x="360" y="260" width="180" height="28" rx="4" fill="#b94a34"/>
      <text x="412" y="279" font-size="12" fill="#fffefa">collective</text>
    </g>
    <g fill="none" stroke="#d9e0da">
      <line x1="110" y1="128" x2="690" y2="128"/>
      <line x1="110" y1="184" x2="690" y2="184"/>
      <line x1="110" y1="240" x2="690" y2="240"/>
      <line x1="110" y1="296" x2="690" y2="296"/>
    </g>
    <text x="360" y="176" font-size="13" fill="#b94a34">GPU 在等通信</text>
    <text x="28" y="348" font-size="15" fill="#1c2926">确认空洞来自发射、同步或网络之后，再用 Nsight Compute 打开那一个 kernel。</text>
  </g>
</svg>
