<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">AI Infra 的八章按依赖排列</title>
  <desc id="desc">上排从三本账到加速器上限，下排从 kernel 复用到集群。后一章使用前一章的结论。</desc>
  <rect width="720" height="300" fill="#fffefa"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="28" y="36" font-size="20" fill="#1c2926">先知道字节在哪，再谈怎么搬、怎么测、怎么分到多张卡</text>
    <g>
      <rect x="28" y="64" width="150" height="78" rx="8" fill="#e7f3f1" stroke="#087f70"/>
      <text x="42" y="94" font-size="13" fill="#087f70">01</text>
      <text x="42" y="118" font-size="16" fill="#1c2926">三本账</text>
      <rect x="196" y="64" width="150" height="78" rx="8" fill="#fffefa" stroke="#d9e0da"/>
      <text x="210" y="94" font-size="13" fill="#68726d">02</text>
      <text x="210" y="118" font-size="16" fill="#1c2926">架构</text>
      <rect x="364" y="64" width="150" height="78" rx="8" fill="#fffefa" stroke="#d9e0da"/>
      <text x="378" y="94" font-size="13" fill="#68726d">03</text>
      <text x="378" y="118" font-size="16" fill="#1c2926">负载</text>
      <rect x="532" y="64" width="160" height="78" rx="8" fill="#f6f1e8" stroke="#b94a34"/>
      <text x="546" y="94" font-size="13" fill="#b94a34">04</text>
      <text x="546" y="118" font-size="16" fill="#1c2926">加速器上限</text>
    </g>
    <g fill="none" stroke="#68726d" stroke-width="1.5">
      <path d="M178 103h18"/>
      <path d="M346 103h18"/>
      <path d="M514 103h18"/>
      <path d="M612 142v28"/>
    </g>
    <g>
      <rect x="28" y="186" width="150" height="78" rx="8" fill="#fffefa" stroke="#d9e0da"/>
      <text x="42" y="216" font-size="13" fill="#68726d">05</text>
      <text x="42" y="240" font-size="16" fill="#1c2926">Kernel 复用</text>
      <rect x="196" y="186" width="150" height="78" rx="8" fill="#fffefa" stroke="#d9e0da"/>
      <text x="210" y="216" font-size="13" fill="#68726d">06</text>
      <text x="210" y="240" font-size="16" fill="#1c2926">测量</text>
      <rect x="364" y="186" width="150" height="78" rx="8" fill="#fffefa" stroke="#d9e0da"/>
      <text x="378" y="216" font-size="13" fill="#68726d">07</text>
      <text x="378" y="240" font-size="16" fill="#1c2926">推理引擎</text>
      <rect x="532" y="186" width="160" height="78" rx="8" fill="#e8eef8" stroke="#245fb0"/>
      <text x="546" y="216" font-size="13" fill="#245fb0">08</text>
      <text x="546" y="240" font-size="16" fill="#1c2926">一簇机器</text>
    </g>
    <g fill="none" stroke="#68726d" stroke-width="1.5">
      <path d="M178 225h18"/>
      <path d="M346 225h18"/>
      <path d="M514 225h18"/>
    </g>
  </g>
</svg>
