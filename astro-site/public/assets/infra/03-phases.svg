<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">推理的两个阶段，以及训练多出来的字节</title>
  <desc id="desc">Prefill 一次处理整段提示。Decode 每次只生成一个 token。训练在参数之外还要留下梯度、主权重、动量和方差。</desc>
  <rect width="720" height="460" fill="#fffefa"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="28" y="36" font-size="20" fill="#1c2926">同一套权重，遇到三种完全不同的访问</text>

    <text x="28" y="78" font-size="15" fill="#087f70">Prefill</text>
    <rect x="28" y="92" width="300" height="42" rx="6" fill="#087f70"/>
    <text x="44" y="118" font-size="15" fill="#fffefa">整段提示并行进入矩阵乘</text>

    <text x="380" y="78" font-size="15" fill="#b94a34">Decode</text>
    <g fill="#b94a34">
      <rect x="380" y="92" width="28" height="42" rx="4"/>
      <rect x="416" y="92" width="28" height="42" rx="4"/>
      <rect x="452" y="92" width="28" height="42" rx="4"/>
      <rect x="488" y="92" width="28" height="42" rx="4"/>
      <rect x="524" y="92" width="28" height="42" rx="4"/>
      <rect x="560" y="92" width="28" height="42" rx="4"/>
      <rect x="596" y="92" width="28" height="42" rx="4"/>
      <rect x="632" y="92" width="28" height="42" rx="4"/>
    </g>
    <text x="380" y="156" font-size="13" fill="#68726d">每一步读一遍越来越长的 KV，写出一个 token</text>

    <text x="28" y="214" font-size="15" fill="#1c2926">一个参数在混合精度 Adam 里常见的 16 字节</text>
    <text x="28" y="236" font-size="13" fill="#68726d">格宽按字节数。绿色是计算用的低精度，蓝色是 fp32 主权重，红色是优化器状态。</text>
    <g font-size="13" fill="#fffefa">
      <rect x="28" y="258" width="56" height="48" fill="#087f70"/>
      <text x="38" y="286">2</text>
      <rect x="84" y="258" width="56" height="48" fill="#1f8f80"/>
      <text x="94" y="286">2</text>
      <rect x="140" y="258" width="112" height="48" fill="#245fb0"/>
      <text x="184" y="286">4</text>
      <rect x="252" y="258" width="112" height="48" fill="#b94a34"/>
      <text x="296" y="286">4</text>
      <rect x="364" y="258" width="112" height="48" fill="#8f3a2a"/>
      <text x="408" y="286">4</text>
    </g>
    <g font-size="13" fill="#68726d">
      <text x="28" y="328">参数</text>
      <text x="84" y="328">梯度</text>
      <text x="140" y="328">fp32 主权重</text>
      <text x="252" y="328">动量 m</text>
      <text x="364" y="328">方差 v</text>
    </g>
    <text x="28" y="378" font-size="15" fill="#1c2926">推理部署通常只留下最左边 2 字节。</text>
    <text x="28" y="406" font-size="15" fill="#1c2926">训练要把整条 16 字节和激活一起放进显存，所以同一模型会先在训练侧超出单卡。</text>
  </g>
</svg>
