<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">


  <title id="title">02 / 长度、距离与归一化</title>
  <desc id="desc">左图两向量长度都是5，两个终点水平相距6；右图把3、4向量缩短为原来的五分之一，方向保持不变。</desc>


  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#087f70"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c16b36"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3176b5"/>
    </marker>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#263a34"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fffefa"/>


  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="28" y="36" font-size="22" fill="#263a34" text-anchor="start">02 / 长度、距离与归一化</text>
    <text x="30" y="84" font-size="19" fill="#263a34" text-anchor="start">长度相同，终点不一定相近</text>
    <line x1="56" y1="286" x2="280" y2="286" stroke="#d5ddd7" stroke-width="1"/>
    <line x1="168" y1="174" x2="168" y2="398" stroke="#d5ddd7" stroke-width="1"/>
    <text x="272" y="309" font-size="16" fill="#68726d" text-anchor="start">x</text>
    <text x="148" y="184" font-size="16" fill="#68726d" text-anchor="start">y</text>
    <text x="149" y="308" font-size="15" fill="#68726d" text-anchor="start">0</text>
    <line x1="168" y1="286" x2="258" y2="166" stroke="#087f70" stroke-width="3" marker-end="url(#green)"/>
    <line x1="168" y1="286" x2="78" y2="166" stroke="#c16b36" stroke-width="3" marker-end="url(#red)"/>
    <line x1="78" y1="143" x2="258" y2="143" stroke="#3176b5" stroke-width="2"/>
    <text x="168" y="124" font-size="18" fill="#3176b5" text-anchor="middle">终点距离 = 6</text>
    <text x="222" y="160" font-size="17" fill="#087f70" text-anchor="start">(3, 4)</text>
    <text x="29" y="160" font-size="17" fill="#c16b36" text-anchor="start">(−3, 4)</text>
    <text x="200" y="239" font-size="20" fill="#087f70" text-anchor="start">5</text>
    <text x="115" y="240" font-size="20" fill="#c16b36" text-anchor="start">5</text>
    <line x1="337" y1="75" x2="337" y2="350" stroke="#d5ddd7" stroke-width="1"/>
    <text x="362" y="84" font-size="19" fill="#263a34" text-anchor="start">同一方向，长度归一为 1</text>
    <line x1="401" y1="290" x2="539" y2="106" stroke="#087f70" stroke-width="3" marker-end="url(#green)"/>
    <line x1="401" y1="290" x2="428.6" y2="253.2" stroke="#c16b36" stroke-width="4" marker-end="url(#red)"/>
    <text x="478" y="170" font-size="18" fill="#087f70" text-anchor="start">长度 5</text>
    <text x="433" y="270" font-size="18" fill="#c16b36" text-anchor="start">长度 1</text>
    <text x="385" y="324" font-size="17" fill="#263a34" text-anchor="start">(3, 4) ÷ 5 = (3/5, 4/5)</text>
    <text x="30" y="396" font-size="19" fill="#263a34" text-anchor="start">范数测量箭头长度；归一化缩放箭头，保留方向。</text>
  </g>
</svg>
