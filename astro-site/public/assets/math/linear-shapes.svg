<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
<title id="title">批量线性层的形状</title><desc id="desc">X 为 B 乘 d，乘 W 的转置 d 乘 m，得到 B 乘 m 的 Z；偏置 m 沿批轴广播。</desc>
<rect width="760" height="220" rx="16" fill="#fffefa"/>
<g font-family="Arial, PingFang SC, sans-serif" text-anchor="middle" fill="#263a34">
<text x="380" y="33" font-size="20">批量线性层：先检查轴，再计算数值</text>
<rect x="28" y="62" width="150" height="88" rx="10" fill="#e1eee9"/><text x="103" y="97" font-size="24">X</text><text x="103" y="130" font-size="20">B × d</text>
<text x="208" y="111" font-size="28">@</text>
<rect x="240" y="62" width="150" height="88" rx="10" fill="#e2eaf7"/><text x="315" y="97" font-size="24">Wᵀ</text><text x="315" y="130" font-size="20">d × m</text>
<text x="421" y="109" font-size="26">+</text>
<rect x="453" y="62" width="90" height="88" rx="10" fill="#f7e9da"/><text x="498" y="97" font-size="24">b</text><text x="498" y="130" font-size="20">m</text>
<text x="573" y="109" font-size="26">=</text>
<rect x="607" y="62" width="126" height="88" rx="10" fill="#e1eee9"/><text x="670" y="97" font-size="24">Z</text><text x="670" y="130" font-size="20">B × m</text>
<text x="204" y="189" font-size="16">收缩输入特征轴 d</text><text x="554" y="189" font-size="16">同一偏置加到每一行</text>
</g></svg>
