[project]
name = "transformer-lab"
version = "0.1.0"
description = "Modern Transformers from basic PyTorch operators, for learning and experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3"]

[project.scripts]
transformer-lab = "transformer_lab.experiments:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
